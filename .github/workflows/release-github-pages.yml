name: Release GitHub page

on:
    push:
        branches:
            - master
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-github-page
    cancel-in-progress: true

jobs:
    build-and-release:
        runs-on: ubuntu-latest

        steps:
            - name: Code source checkout
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build
              run: pnpm build

            - name: Deploy distribution files to release branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  publish_branch: release/github-page
                  force_orphan: true
